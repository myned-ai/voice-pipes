[package]
name = "voice-pipes-llm-openai-compat"
version.workspace = true
edition = "2024"
description = "An LLM over the OpenAI chat-completions API (OpenAI, llama-server, vLLM, Ollama) as a voice-pipes plugin, on the SDK only"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
voice-pipes-sdk.workspace = true
voice-pipes-net.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
voice-pipes-sdk = { workspace = true, features = ["testing"] }
voice-pipes-net = { workspace = true, features = ["testing"] }
async-stream.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
