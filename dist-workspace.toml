[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Supply-chain metadata for every release binary: the dependency list embedded
# in the binary (cargo-auditable, scannable later with `cargo audit bin`), a
# CycloneDX SBOM per artifact, and GitHub build-provenance attestations
# (`gh attestation verify <file> --repo <owner>/<repo>`).
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true
# release.yml is regenerated by `dist generate` and then edited by hand:
# every `uses:` pinned to a commit SHA, and the `plan` job's first step
# waits for core-tests to pass on the tagged commit (with `actions: read`
# for it). Re-apply both after regenerating. It intentionally differs from
# dist's output; without this, `dist plan` refuses to run.
allow-dirty = ["ci"]

# System packages the release runners need to build the CLI (cpal -> alsa-sys on Linux).
[dist.dependencies.apt]
libasound2-dev = "*"
