[package]
name = "voice-pipes-onnx"
version.workspace = true
edition = "2024"
description = "The bounded inference-session pool shared by every local ONNX provider, in and out of tree"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# One way to open an ONNX Runtime session (threads, optimisation, the
# execution provider). Off by default: the engine takes this crate for the
# session pool alone and must not link ONNX Runtime unless a model needs it.
session = ["dep:ort"]
# CUDA sessions, for providers built with their `ort-cuda` feature.
cuda = ["session", "ort/cuda"]
# The shared log-mel pieces (window, filterbank, power spectra).
mel = ["dep:rustfft"]

[dependencies]
ort = { workspace = true, optional = true }
parking_lot.workspace = true
rustfft = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "test-util"] }
