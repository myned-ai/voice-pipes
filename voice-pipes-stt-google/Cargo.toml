[package]
name = "voice-pipes-stt-google"
version.workspace = true
edition = "2024"
description = "Google Cloud Speech-to-Text v2 (Chirp 3) streaming recogniser as a voice-pipes plugin, on the SDK only"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
voice-pipes-sdk.workspace = true
anyhow.workspace = true
async-trait.workspace = true
gcp_auth.workspace = true
prost.workspace = true
prost-types.workspace = true
# tls-native-roots: this client talks to a public TLS endpoint; the crate is
# the only one in the workspace that needs it.
tonic = { workspace = true, features = ["tls-native-roots"] }
voice-pipes-net.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[build-dependencies]
tonic-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
voice-pipes-sdk = { workspace = true, features = ["testing"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# `net` gives TcpListenerStream for the in-process fake Speech server.
tokio-stream = { workspace = true, features = ["net"] }
