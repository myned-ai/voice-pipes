# Publishes the crates to crates.io with trusted publishing: GitHub's OIDC
# token is exchanged for a short-lived crates.io token, so no API token is
# stored in the repository. Each crate must name this workflow (and the
# `crates-io` environment) as a trusted publisher on crates.io first; see
# docs/contributing/release-process.md.
#
# Two releases, two triggers:
# - a `vX.Y.Z` tag (the one cargo-dist releases the CLI from) publishes every
#   crate but the SDK, at the workspace version, which the tag must match;
# - a manual run with `target: sdk` publishes the SDK alone, at its own
#   version: it is versioned apart, under its stability policy.
name: publish

on:
  # Tag-triggered automatic publishing is disabled until initial crates.io bootstrapping
  # is performed (see docs/contributing/release-process.md#cratesio-the-first-time).
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        type: choice
        options:
          - sdk
          - workspace
        default: sdk

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Required reviewers, if any, are set on this environment in the
    # repository settings; crates.io's trusted-publisher entry names it.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Nothing is published from a commit whose core tests did not pass.
      - name: core-tests passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/require-green-ci.sh "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: what to publish
        id: target
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'workspace' }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            want="${REF_NAME#v}"
            have=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='voice-pipes'))")
            if [ "$want" != "$have" ]; then
              echo "tag $REF_NAME does not match the workspace version $have" >&2
              exit 1
            fi
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: publish the SDK
        if: steps.target.outputs.target == 'sdk'
        run: cargo publish -p voice-pipes-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: publish every crate but the SDK, dependencies first
        if: steps.target.outputs.target == 'workspace'
        run: cargo publish --workspace --exclude voice-pipes-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
