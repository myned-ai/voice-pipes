name: images

# Builds and pushes the container images to GHCR on every release tag:
#   ghcr.io/<owner>/voice-pipes                 engine (worker and orchestrator: same image, different command)
#   ghcr.io/<owner>/voice-pipes-admin-frontend  admin console, production nginx build
#   ghcr.io/<owner>/voice-pipes-admin-backend   admin BFF
# The CUDA and VibeVoice images are deliberately not published (runner cost);
# the launcher builds them locally. GHCR packages are private on first push:
# flip them to public once in the package settings.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Signing and provenance: a short-lived OIDC identity for Sigstore, and
  # permission to store the attestation.
  id-token: write
  attestations: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published from a commit whose core tests did not pass.
  ci-green:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: core-tests passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/require-green-ci.sh "${{ github.sha }}"

  build:
    needs: ci-green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: voice-pipes
            context: .
            dockerfile: voice-pipes/Dockerfile
          - name: voice-pipes-admin-frontend
            context: voice-pipes-admin/frontend
            dockerfile: voice-pipes-admin/frontend/Dockerfile
          - name: voice-pipes-admin-backend
            context: voice-pipes-admin/backend
            dockerfile: voice-pipes-admin/backend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # The engine image ships the features CI tests with, read from the
      # same source (scripts/image-features.py reads the compose file).
      - id: features
        if: matrix.name == 'voice-pipes'
        run: echo "cli=$(python3 scripts/image-features.py cli)" >> "$GITHUB_OUTPUT"
      # Every published image runs unprivileged: build it into the local
      # daemon and check the effective uid before anything is pushed. The
      # push below reuses this build's layers from the cache.
      - name: Build for the uid check
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.name == 'voice-pipes' && format('FEATURES={0}', steps.features.outputs.cli) || '' }}
          load: true
          push: false
          tags: local/${{ matrix.name }}:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert non-root runtime user
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint '' local/${{ matrix.name }}:check id -u)"
          echo "${{ matrix.name }} runs as uid $uid"
          test "$uid" != "0"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.name == 'voice-pipes' && format('FEATURES={0}', steps.features.outputs.cli) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit's own SLSA provenance and an SPDX SBOM, stored with the
          # image in the registry.
          provenance: mode=max
          sbom: true
      # GitHub build provenance for the pushed digest, also pushed to the
      # registry: `gh attestation verify oci://<image> --repo <owner>/<repo>`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Keyless Sigstore signature on the digest, for `cosign verify`.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
