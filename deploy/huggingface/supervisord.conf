[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
loglevel=info

# 1. Local CPU LLM server (Qwen 2.5 1.5B Instruct Q4_K_M by default)
[program:llama-server]
command=/bin/sh -c "exec /opt/llama/llama-server -m %(ENV_MODELS_DIR)s/%(ENV_LLAMA_MODEL_FILE)s --host 127.0.0.1 --port 8081 -t %(ENV_LLAMA_THREADS)s --parallel %(ENV_LLAMA_PARALLEL)s --cont-batching -c %(ENV_LLAMA_CTX)s --jinja"
priority=10
autorestart=true
startsecs=5
stdout_logfile=/tmp/llama-server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/tmp/llama-server.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

# 1b. Kyutai Pocket-TTS HTTP server (CPU, loopback :8002, with startup warm-up)
[program:pocket-tts]
command=/app/hf/pocket-tts-start.sh
priority=15
autorestart=true
startsecs=5
stdout_logfile=/tmp/pocket-tts.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/tmp/pocket-tts.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

# 2. Voice Pipes Orchestrator (SQLite session index + worker registry)
[program:orchestrator]
command=/usr/local/bin/voice-pipes orchestrate --orchestrator-config /app/hf/config/orchestrator-hf.toml
directory=/app
priority=20
autorestart=true
startsecs=3
stdout_logfile=/tmp/orchestrator.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/tmp/orchestrator.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

# 3. Voice Pipes CPU Pipeline Worker (Silero VAD + Moonshine STT + Pocket-TTS HTTP)
[program:worker]
command=/bin/sh -c "sleep 3 && exec /usr/local/bin/voice-pipes --config /app/hf/config/pipeline-hf-cpu.toml serve --worker-config /app/hf/config/worker-hf-cpu.toml"
directory=/app
priority=30
autorestart=true
startsecs=5
stdout_logfile=/tmp/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
stderr_logfile=/tmp/worker.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

# 4. Admin Console BFF (FastAPI — multi-tenant auth, scoped analytics, TTL janitor)
[program:admin-backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips="*"
directory=/app/backend
priority=40
autorestart=true
startsecs=3
stdout_logfile=/tmp/admin-backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/tmp/admin-backend.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

# 5. Nginx Reverse Proxy on HF Spaces port 7860
[program:nginx]
command=nginx -c /app/hf/nginx.conf -g "daemon off;"
priority=50
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
