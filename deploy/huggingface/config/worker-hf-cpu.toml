# Voice Pipes CPU Worker configuration for Hugging Face Spaces.

id = "worker-hf-cpu"
max_concurrent = 8
debug_port = 8085
debug_bind = "127.0.0.1"
advertise_address = "127.0.0.1:8085"
transport_advertise_address = "127.0.0.1:8800"
tags = ["env:hf-space", "device:cpu", "lang:en", "stt:moonshine", "tts:pocket-http", "llm:qwen2.5-1.5b"]

[orchestrator]
endpoint = "http://127.0.0.1:9090"
heartbeat_interval_s = 5
register_timeout_s = 10
