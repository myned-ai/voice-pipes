[package]
name = "voice-pipes-tts-piper"
version.workspace = true
edition = "2024"
description = "Piper VITS (local ONNX, espeak-ng phonemes) as a voice-pipes voice plugin, on the SDK only"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
voice-pipes-sdk.workspace = true
voice-pipes-onnx = { workspace = true, features = ["session"] }
async-trait.workspace = true
ort.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[features]
ort-cuda = ["ort/cuda", "voice-pipes-onnx/cuda"]

[dev-dependencies]
voice-pipes-sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
