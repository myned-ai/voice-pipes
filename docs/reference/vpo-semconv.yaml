# VPO — Voice Pipeline Open Standard
# OpenTelemetry Semantic Conventions for voice-agent metrics (Layer 1, VPO-Metrics)
#
# Status: draft, tracks VPO-Metrics v0.1 (see docs/reference/vpo-metrics.md).
# Format: OpenTelemetry semantic-convention YAML (groups of attributes, spans, metrics).
#
# Purpose: the drop-in adoption artifact. A team on ANY decomposed STT->LLM->TTS or
# speech-to-speech voice stack can emit VPO-conformant telemetry by mapping their
# existing signals onto these attributes — no VPO runtime required.
#
# Modelling summary:
#   - A TURN is an OTel span (root of the turn trace). Span name: "vpo.turn".
#   - Each COMPONENT (stt/llm/tts/realtime/...) is a CHILD span named "<kind>:<name>".
#   - CLIENT timing events are span events on the turn span (vpo.client.<event>).
#   - DERIVED KPIs (TTFA, TTFB, barge-in RTT, ...) are instruments (metrics).
#   - Every metric carries vpo.provenance = client | server (truthful provenance, §4).
#
# Naming rules:
#   - All attribute keys are prefixed `vpo.`.
#   - Component metric keys mirror the canonical catalog (§5) under `vpo.<kind>.<key>`.
#   - Vendor-specific metrics MUST use `vpo.x.<vendor>.<name>` (reserved escape hatch).

groups:
  # ───────────────────────────────────────────────────────────────────────
  # Shared correlation + identity attributes
  # ───────────────────────────────────────────────────────────────────────
  - id: registry.vpo.core
    type: attribute_group
    brief: Core correlation and identity attributes shared by all VPO signals.
    attributes:
      - id: vpo.utterance_id
        type: int
        requirement_level: required
        brief: The join key for one turn. Correlates client timing, server spans, and derived KPIs.
        examples: [42]
      - id: vpo.session_id
        type: string
        requirement_level: recommended
        brief: Stable session identifier the turn belongs to.
      - id: vpo.pipeline_name
        type: string
        requirement_level: recommended
        brief: Logical pipeline/route name. Enables per-pipeline partitioning.
      - id: vpo.provenance
        type:
          members:
            - id: client
              value: "client"
              brief: Measured on the client (perceived truth — delivery + device buffering).
            - id: server
              value: "server"
              brief: Measured on the server (per-stage inference cost).
        requirement_level: required
        brief: Where the signal was measured. Server estimates of client-perceived values are non-conformant.
      - id: vpo.topology
        type:
          members:
            - id: decomposed
              value: "decomposed"
              brief: Classic STT -> LLM -> TTS pipeline.
            - id: realtime
              value: "realtime"
              brief: Single speech-to-speech model (STT+LLM+TTS collapsed).
        requirement_level: recommended
        brief: Pipeline topology. Cross-topology comparison MUST use derived KPIs, not stage-internal metrics.

  # ───────────────────────────────────────────────────────────────────────
  # Turn span (root)
  # ───────────────────────────────────────────────────────────────────────
  - id: span.vpo.turn
    type: span
    span_kind: server
    brief: >
      One turn of the voice pipeline: from accepting user input to completing (or being
      interrupted on) the agent's response. Root of the turn trace.
    note: Maps to TurnMetricsSnapshot. Emitted exactly once per turn.
    attributes:
      - ref: vpo.utterance_id
      - ref: vpo.session_id
      - ref: vpo.pipeline_name
      - ref: vpo.topology
      - id: vpo.turn.total_ms
        type: int
        requirement_level: required
        brief: Server-measured wall-clock from turn start to snapshot (ms).
      - id: vpo.turn.interrupted
        type: boolean
        requirement_level: required
        brief: Whether the turn was cut short by barge-in.
      - id: vpo.turn.initiator
        type:
          members:
            - id: user
              value: "user"
              brief: Turn initiated by user speech or text input.
            - id: agent
              value: "agent"
              brief: Turn initiated proactively by the agent (e.g. greeting / agent_say).
        requirement_level: recommended
        brief: Who initiated the turn. Agent-initiated turns are excluded from user-perceived critical-path latency percentiles.
      - id: vpo.turn.llm_response_text
        type: string
        requirement_level: opt_in
        brief: Response text accumulated this turn (may be PII — opt-in only).

  # ───────────────────────────────────────────────────────────────────────
  # Component span (child) — shared shape
  # ───────────────────────────────────────────────────────────────────────
  - id: span.vpo.component
    type: span
    span_kind: internal
    brief: One component's timed slice within a turn. Child of the turn span. Named "<kind>:<name>".
    note: >
      Open-span rule (§3.2): a component interrupted mid-stage MUST be emitted with a start
      time but NO end time / latency. Do NOT fabricate an end time. In OTel terms, record the
      span with its start timestamp and mark status as appropriate; do not synthesize a duration.
    attributes:
      - ref: vpo.utterance_id
      - id: vpo.component.id
        type: string
        requirement_level: required
        brief: Stable "<kind>:<name>" identifier.
        examples: ["stt:parakeet", "llm:openai", "tts:piper", "realtime:openai"]
      - id: vpo.component.kind
        type: string
        requirement_level: required
        brief: Coarse class (snake_case).
        examples: ["stt", "llm", "tts", "vad", "output", "audio_post", "annotator", "text_post", "translator", "realtime"]
      - id: vpo.component.started_at_ms
        type: int
        requirement_level: required
        brief: Begin time relative to turn start (ms).
      - id: vpo.component.finished_at_ms
        type: int
        requirement_level:
          conditionally_required: only when the span completed (omit when interrupted mid-stage)
        brief: End time relative to turn start (ms).
      - id: vpo.component.latency_ms
        type: int
        requirement_level:
          conditionally_required: only when finished_at_ms is present
        brief: finished_at_ms - started_at_ms. MUST NOT be set independently of the timestamps.
      - id: vpo.component.provider
        type: string
        requirement_level: recommended
        brief: Provider/model name.
      - id: vpo.component.cold_start
        type: boolean
        requirement_level: recommended
        brief: True on first call against the provider handle (model-load overhead). Default false.
      - id: vpo.component.error
        type: string
        requirement_level:
          conditionally_required: when the span errored
        brief: Failure reason.

  # ───────────────────────────────────────────────────────────────────────
  # Canonical component metric attributes (carried on the component span)
  # ───────────────────────────────────────────────────────────────────────
  - id: registry.vpo.stt
    type: attribute_group
    brief: "Canonical STT metrics (kind: stt). Units per VPO-Metrics §5.1."
    attributes:
      - id: vpo.stt.processing_ms
        type: int
        brief: "STT inference wall-time for the utterance. unit=ms"
      - id: vpo.stt.endpointing_ms
        type: int
        brief: "Delay from end-of-speech to STT cutoff decision. unit=ms"
      - id: vpo.stt.audio_duration_ms
        type: int
        brief: "Wall-clock duration of audio consumed. unit=ms"
      - id: vpo.stt.rtfx
        type: double
        brief: "Realtime factor, audio / wall (>1 = faster than realtime). unit=ratio"
      - id: vpo.stt.algorithmic_delay_ms
        type: int
        brief: "Codec/buffering latency inherent to the model/stream. unit=ms"
      - id: vpo.stt.effective_latency_ms
        type: int
        brief: "User-facing STT latency (typically endpointing + processing). unit=ms"
      - id: vpo.stt.inference_count
        type: int
        brief: "Encoder/inference passes for the utterance. unit=count"
      - id: vpo.stt.streaming_window_ms
        type: int
        brief: "Buffered audio per streaming frame. unit=ms"

  - id: registry.vpo.llm
    type: attribute_group
    brief: "Canonical LLM metrics (kind: llm). Units per VPO-Metrics §5.2."
    attributes:
      - id: vpo.llm.ttft_ms
        type: int
        brief: "Time to first token (model first-token latency, contained in llm_wait_ms). unit=ms"
      - id: vpo.llm.wait_ms
        type: int
        brief: "Engine-measured contiguous LLM stage wait (utterance.committed_at -> first LLM text fragment). unit=ms"
      - id: vpo.llm.perceived_ttft_ms
        type: int
        brief: "TTFT including scheduling/queueing as the pipeline experienced it. unit=ms"
      - id: vpo.llm.generation_ms
        type: int
        brief: "Token generation duration (first to last token). unit=ms"
      - id: vpo.llm.token_count
        type: int
        brief: "Output tokens generated (authoritative when provided). unit=count"
      - id: vpo.llm.token_estimate
        type: int
        brief: "Estimated tokens when an exact count is unavailable. unit=count"
      - id: vpo.llm.stage_skipped_reason
        type: string
        brief: "Why the LLM stage did not run (agent_say or speculative_accept). unit=raw"
      - id: vpo.llm.speculative_rollbacks
        type: int
        brief: "Speculative-decoding rollbacks. unit=count"
      - id: vpo.llm.speculative_tokens_generated
        type: int
        brief: "Tokens produced speculatively. unit=count"
      - id: vpo.llm.speculative_tokens_accepted
        type: int
        brief: "Speculative tokens committed. unit=count"
      - id: vpo.llm.speculative_efficiency
        type: double
        brief: "Accepted / generated speculative tokens. unit=percent"

  - id: registry.vpo.tts
    type: attribute_group
    brief: "Canonical TTS metrics (kind: tts). Units per VPO-Metrics §5.3."
    attributes:
      - id: vpo.tts.ttfb_ms
        type: int
        brief: "Time to first audio byte (synthesis request -> first audio, contained in tts_wait_ms). unit=ms"
      - id: vpo.tts.internal_ttfb_ms
        type: int
        brief: "Pre-pacer provider startup and first audio chunk generation (contained in tts_wait_ms). unit=ms"
      - id: vpo.tts.wait_ms
        type: int
        brief: "Engine-measured contiguous TTS stage wait (first LLM text fragment -> first raw TTS audio chunk). unit=ms"
      - id: vpo.tts.output_wait_ms
        type: int
        brief: "Engine-measured contiguous output stage wait (first raw TTS audio chunk -> first emitted audio frame). unit=ms"
      - id: vpo.tts.commit_to_first_audio_ms
        type: int
        brief: "Engine-measured total post-commit wait (llm_wait_ms + tts_wait_ms + output_wait_ms). unit=ms"
      - id: vpo.tts.synthesis_ms
        type: int
        brief: "Total synthesis wall-time. unit=ms"
      - id: vpo.tts.audio_duration_ms
        type: int
        brief: "Duration of synthesized audio produced. unit=ms"
      - id: vpo.tts.rtf
        type: double
        brief: "Realtime factor, wall / audio (<1.0 = faster than realtime; production target). unit=ratio"
      - id: vpo.tts.rtfx
        type: double
        brief: "Inverse convention, audio / wall. Consumers MUST read by key, not assume. unit=ratio"
      - id: vpo.tts.chars
        type: int
        brief: "Input character count synthesized. unit=count"
      - id: vpo.tts.sample_rate
        type: int
        brief: "Output sample rate (Hz). unit=count"
      - id: vpo.tts.stage_skipped_reason
        type: string
        brief: "Why on-commit TTS synthesis did not run (speculative_accept). unit=raw"

  - id: registry.vpo.realtime
    type: attribute_group
    brief: "Canonical Realtime S2S metrics (kind: realtime). Units per VPO-Metrics §5.4."
    attributes:
      - id: vpo.realtime.ttfb_ms
        type: int
        brief: "Time to first audio delta from the model, anchored at end-of-user-speech. unit=ms"
      - id: vpo.realtime.provider_endpointing_ms
        type: int
        brief: "Delay between engine uplink VAD speech end and provider speech-stopped notification. unit=ms"
      - id: vpo.realtime.first_text_ms
        type: int
        brief: "Diagnostic delay from end-of-user-speech anchor to first transcript delta. unit=ms"
      - id: vpo.realtime.ttfb_anchor_source
        type: string
        brief: "End-of-speech anchor provenance (provider_speech_stopped, vp_vad, client_speech_end, input_transcript_proxy, text_submit, turn_start). unit=raw"
      - id: vpo.realtime.audio_output_ms
        type: int
        brief: "Duration of audio output produced. unit=ms"
      - id: vpo.realtime.input_audio_ms
        type: int
        brief: "Accumulated input audio duration. unit=ms"
      - id: vpo.realtime.sample_rate
        type: int
        brief: "Output sample rate (Hz). unit=count"
      - id: vpo.realtime.user_speech_end_epoch_ms
        type: int
        brief: "Wall-clock epoch (ms) of the end-of-user-speech anchor. unit=ms"
      - id: vpo.realtime.input_speech_dbfs
        type: double
        brief: "RMS level of active speech frames in dBFS. unit=db"
      - id: vpo.realtime.input_noise_dbfs
        type: double
        brief: "Estimated noise floor of non-speech frames in dBFS. unit=db"
      - id: vpo.realtime.input_snr_db
        type: double
        brief: "Input signal-to-noise ratio (input_speech_dbfs - input_noise_dbfs). unit=db"
      - id: vpo.realtime.input_peak_dbfs
        type: double
        brief: "Peak sample amplitude of the utterance in dBFS. unit=db"
      - id: vpo.realtime.input_clipped_ratio
        type: double
        brief: "Fraction of input samples at full-scale clipping. unit=ratio"
      - id: vpo.realtime.input_speech_ratio
        type: double
        brief: "Fraction of input frames classified as speech. unit=ratio"
      - id: vpo.realtime.input_speech_ms
        type: int
        brief: "Cumulative duration of speech-classified input frames. unit=ms"
      - id: vpo.realtime.input_level_source
        type: string
        brief: "Source of the input audio level measurement (e.g. vp_uplink_meter). unit=raw"

  - id: registry.vpo.output
    type: attribute_group
    brief: "Canonical Output emission metrics (kind: output). Units per VPO-Metrics §5.5."
    attributes:
      - id: vpo.output.emit_rtf
        type: double
        brief: "Streaming-phase output emission wall time / audio duration. unit=ratio"
      - id: vpo.output.source_rtf
        type: double
        brief: "Pre-post-processor provider emission wall time / audio duration. unit=ratio"
      - id: vpo.output.chain_overhead_ms
        type: int
        brief: "Summed wall time spent in inline audio_post processors during the turn. unit=ms"
      - id: vpo.output.audio_output_ms
        type: int
        brief: "Total duration of emitted output audio. unit=ms"
      - id: vpo.output.output_wait_ms
        type: int
        brief: "Engine-measured contiguous output stage wait (first raw audio chunk -> first emitted frame). unit=ms"
      - id: vpo.output.commit_to_first_audio_ms
        type: int
        brief: "Engine-measured total post-commit wait (utterance.committed_at -> first emitted frame). unit=ms"

  - id: registry.vpo.audio_post
    type: attribute_group
    brief: "Canonical inline Audio Post-Processor metrics (kind: audio_post). Units per VPO-Metrics §5.5."
    attributes:
      - id: vpo.audio_post.budget_ratio
        type: double
        brief: "Mean call latency / mean chunk audio duration (>1.0 cannot keep up with real time). unit=ratio"
      - id: vpo.audio_post.latency_p50_ms
        type: int
        brief: "Median per-chunk processing latency. unit=ms"
      - id: vpo.audio_post.latency_max_ms
        type: int
        brief: "Maximum per-chunk processing latency in the turn. unit=ms"
      - id: vpo.audio_post.calls
        type: int
        brief: "Chunks processed in the turn. unit=count"
      - id: vpo.audio_post.timeouts
        type: int
        brief: "Calls that exceeded the per-chunk timeout. unit=count"
      - id: vpo.audio_post.failures
        type: int
        brief: "Calls that returned an error. unit=count"

  - id: registry.vpo.annotator
    type: attribute_group
    brief: "Canonical off-critical-path Audio Annotator metrics (kind: annotator). Units per VPO-Metrics §5.5."
    attributes:
      - id: vpo.annotator.latency_p50_ms
        type: int
        brief: "Median per-segment annotation latency. unit=ms"
      - id: vpo.annotator.lag_max_ms
        type: int
        brief: "Maximum lag of an annotation frame behind its corresponding audio timestamp. unit=ms"
      - id: vpo.annotator.latency_max_ms
        type: int
        brief: "Maximum per-segment annotation latency in the turn. unit=ms"
      - id: vpo.annotator.segments
        type: int
        brief: "Audio segments submitted to the annotator. unit=count"
      - id: vpo.annotator.annotations
        type: int
        brief: "Annotation frames emitted. unit=count"
      - id: vpo.annotator.dropped_chunks
        type: int
        brief: "Audio chunks dropped due to backpressure. unit=count"
      - id: vpo.annotator.timeouts
        type: int
        brief: "Annotator calls that timed out. unit=count"
      - id: vpo.annotator.skipped_segments
        type: int
        brief: "Segments skipped while the circuit breaker was open. unit=count"
      - id: vpo.annotator.annotation_kbps
        type: double
        brief: "Annotation payload bitrate (kbps). unit=ratio"
      - id: vpo.annotator.annotation_bytes
        type: int
        brief: "Total annotation payload bytes emitted in the turn. unit=bytes"
      - id: vpo.annotator.breaker_open
        type: int
        brief: "1 if the annotator circuit breaker opened during the turn, 0 otherwise. unit=count"

  # ───────────────────────────────────────────────────────────────────────
  # Client timing events (span events on the turn span) — provenance=client
  # ───────────────────────────────────────────────────────────────────────
  - id: event.vpo.client_timing
    type: event
    name: vpo.client.timing
    brief: >
      A client-reported timing event for one utterance. Recorded as a span event on the turn
      span. These are the provenance=client signals; they MUST originate on the client (§4.1).
    attributes:
      - ref: vpo.utterance_id
      - id: vpo.client.event
        type:
          members:
            - { id: speech_start,      value: "speech_start",      brief: "Mic captured first speech frame." }
            - { id: speech_end,        value: "speech_end",        brief: "Client VAD detected end of speech." }
            - { id: audio_receive,     value: "audio_receive",     brief: "First response audio byte received from server." }
            - { id: playback_start,    value: "playback_start",    brief: "Client began the playback pipeline." }
            - { id: first_byte_played, value: "first_byte_played", brief: "First PCM sample rendered to device." }
            - { id: playback_end,      value: "playback_end",      brief: "Client finished playing response audio." }
            - { id: underrun,          value: "underrun",          brief: "Audio buffer underran (audible glitch)." }
        requirement_level: required
        brief: The timing event kind. Unknown values MUST be preserved, not rejected (forward-compat).
      - id: vpo.client.timestamp_ms
        type: int
        requirement_level: required
        brief: Client-epoch timestamp (ms). MUST NOT be subtracted from server-monotonic time except via correlated RTT.
      - id: vpo.client.played_ms
        type: int
        requirement_level:
          conditionally_required: on a playback report at interruption
        brief: Audio actually played before interruption (PlaybackReport). Drives server-side history truncation.

  # ───────────────────────────────────────────────────────────────────────
  # Derived KPI instruments (metrics) — §6
  # ───────────────────────────────────────────────────────────────────────
  - id: metric.vpo.ttfa_ms
    type: metric
    metric_name: vpo.ttfa_ms
    instrument: histogram
    unit: "ms"
    brief: "Time-to-First-Audio = audio_receive - speech_end. provenance=client only."
    attributes: [vpo.session_id, vpo.pipeline_name]

  - id: metric.vpo.perceived_first_sound_ms
    type: metric
    metric_name: vpo.perceived_first_sound_ms
    instrument: histogram
    unit: "ms"
    brief: "first_byte_played - speech_end. provenance=client only."
    attributes: [vpo.session_id, vpo.pipeline_name]

  - id: metric.vpo.ttfb_ms
    type: metric
    metric_name: vpo.ttfb_ms
    instrument: histogram
    unit: "ms"
    brief: "TTS time-to-first-byte. provenance=server. SLO: p95 <= 300ms (feels human), <= 600ms acceptable."
    attributes: [vpo.pipeline_name]

  - id: metric.vpo.ttft_ms
    type: metric
    metric_name: vpo.ttft_ms
    instrument: histogram
    unit: "ms"
    brief: "LLM time-to-first-token. provenance=server."
    attributes: [vpo.pipeline_name]

  - id: metric.vpo.barge_in_rtt_ms
    type: metric
    metric_name: vpo.barge_in_rtt_ms
    instrument: histogram
    unit: "ms"
    brief: >
      Barge-in round-trip: new-utterance speech_start -> server interrupt detection. The one KPI that
      crosses the client/server boundary; MUST use correlated ping/pong RTT, never raw cross-clock
      subtraction. SLO target p95 <= 300ms.
    attributes: [vpo.pipeline_name]

  - id: metric.vpo.underrun_rate
    type: metric
    metric_name: vpo.underrun_rate
    instrument: gauge
    unit: "1"
    brief: "count(underrun) / turns. provenance=client. Any sustained nonzero is an incident."
    attributes: [vpo.pipeline_name]

  - id: metric.vpo.interruption_rate
    type: metric
    metric_name: vpo.interruption_rate
    instrument: gauge
    unit: "1"
    brief: "count(interrupted turns) / turns. provenance=server."
    attributes: [vpo.pipeline_name]

  - id: metric.vpo.tts_rtf
    type: metric
    metric_name: vpo.tts_rtf
    instrument: gauge
    unit: "1"
    brief: "TTS realtime factor (wall/audio). provenance=server. Production SLO: < 1.0 sustained."
    attributes: [vpo.pipeline_name, vpo.component.provider]

  - id: metric.vpo.e2e_ms
    type: metric
    metric_name: vpo.e2e_ms
    instrument: histogram
    unit: "ms"
    brief: "End-to-end turn duration. provenance=server (turn.total_ms). SLO ceiling: p95 <= 4000ms."
    attributes: [vpo.pipeline_name]
