[package]
name = "voice-pipes-stt-assemblyai"
version.workspace = true
edition = "2024"
description = "AssemblyAI streaming speech-to-text (v3 WebSocket) as a voice-pipes plugin, on the SDK only"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
voice-pipes-sdk.workspace = true
voice-pipes-net = { workspace = true, features = ["ws"] }
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
voice-pipes-sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
