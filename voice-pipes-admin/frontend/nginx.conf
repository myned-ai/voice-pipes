server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-router fallback (react-router-dom). `/` and the fallback
    # are internal redirects to /index.html, so they take that location's
    # headers.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The entry document names the current content-hashed bundles; a cached
    # copy would keep loading the previous release's assets after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets — cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Runtime-mounted playground extensions + manifest are unhashed: never cache.
    # (mount at /usr/share/nginx/html/ext/ and
    # /usr/share/nginx/html/playground-extensions.json)
    location = /playground-extensions.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location /ext/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
