# Response headers every location sends. nginx drops the server-level
# add_header set from any location that has an add_header of its own, so
# each location includes this file instead of relying on inheritance.
# `always` puts them on error responses too.
add_header X-Content-Type-Options "nosniff" always;
# The console is never meant to be framed. The CSP carries only
# frame-ancestors, which governs who may embed the page and nothing the
# page itself loads (scripts, styles, WebSocket, SSE, audio).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
