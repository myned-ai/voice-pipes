# Live pipeline with AssemblyAI STT + OpenAI LLM (gpt-4o-mini)
#
# Requires ASSEMBLYAI_API_KEY and OPENAI_API_KEY environment variables.

[pipeline]
name = "live-assemblyai"

[pipeline.audit]
enabled = true
captures_dir = "captures"

[transport]
enabled = true
port = 8800

[stt]
provider = "assemblyai"
model_name = "u3-rt-pro"

[stt.options]
format_turns = true
min_turn_silence = 200

[turn_detection]
mode = "provider"
silence_timeout_ms = 1000

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

[[text_processor]]
type = "openai-compat"
model = "gpt-4o-mini"
system_prompt = "You are a friendly voice assistant named Pipes. Have a natural conversation. Keep responses to one or two short sentences."
max_tokens = 128
temperature = 0.6
