# Benchmark variant: OpenAI GPT-4o-mini
#
# Same pipeline as test-live-openai.toml but with transport on port 8801
# for multi-variant benchmark (variant B slot).
#
# Requires OPENAI_API_KEY environment variable to be set.

[pipeline]
name = "bench-openai"

[pipeline.audit]
enabled = true
captures_dir = "captures"

[transport]
enabled = true
port = 8801

[vad]
mode = "silero"
model = "models/silero_vad.onnx"
speech_prob = 0.5
min_speech_ms = 100
min_silence_ms = 50

[stt]
provider = "parakeet-tdt"
model_dir = "models/parakeet-tdt"

[stt.options]
initial_buffer_ms = 800.0
inference_step_ms = 1000.0

[turn_detection]
mode = "layered"
silence_timeout_ms = 1000

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

[[text_processor]]
type = "openai-compat"
model = "gpt-4o-mini"
system_prompt = "You are a friendly voice assistant named Pipes. Have a natural conversation. Keep responses to one or two short sentences."
max_tokens = 128
