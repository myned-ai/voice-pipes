# Benchmark variant: Piper TTS
#
# TTS-comparison variant. The pipeline is intentionally minimal: a stable
# local STT (Parakeet TDT) drives an `echo` text processor, so the input
# audio is transcribed and the transcript is fed verbatim into TTS. This
# isolates the TTS provider as the variable under test — no LLM jitter.
#
# Pair with: voice-pipes/worker-bench-piper.toml
#
# Required model:
#   - models/en_US-lessac-medium.onnx
#
# Build (one-time; needed because of the tts-piper feature flag):
#   cargo build --release --features=tts-piper
#
# Run standalone (no orchestrator; WebSocket on 127.0.0.1:8802/ws):
#   cargo run --release --features tts-piper -- --config examples/bench-piper.toml serve
#   # or, after build:
#   target\release\voice-pipes.exe --config examples/bench-piper.toml serve
#
# Run as a benchmark worker (registers with a running orchestrator):
#   target\release\voice-pipes.exe --config examples/bench-piper.toml serve `
#       --worker-config worker-bench-piper.toml
#
# See also:
#   - examples/bench-pocket-http.toml  (companion variant)
#   - run-benchmark-piper-vs-pocket.ps1

[pipeline]
name = "bench-piper"

[pipeline.audit]
enabled = true
captures_dir = "captures"

[transport]
enabled = true
port = 8802

[vad]
mode = "silero"
model = "models/silero_vad.onnx"
speech_prob = 0.5
min_speech_ms = 100
min_silence_ms = 50

[stt]
provider = "parakeet-tdt"
model_dir = "models/parakeet-tdt"

[stt.options]
initial_buffer_ms = 800.0
inference_step_ms = 1000.0

[turn_detection]
mode = "layered"
silence_timeout_ms = 1000

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

# Echo the STT transcript straight to TTS — no LLM in the loop. This makes
# the run a pure STT→TTS comparison so per-rep variance comes only from
# the TTS engine.
[[text_processor]]
type = "echo"
