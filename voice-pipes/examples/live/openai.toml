# Live mode: mic → VAD → STT → LLM → TTS → speaker (full real-time voice loop).
#
# Uses hosted OpenAI GPT-4o-mini instead of a local Gemma 4 model.
# No local llama-server needed — requires OPENAI_API_KEY env var.
#
# Prerequisites:
#   - OPENAI_API_KEY env var set
#   - ASSEMBLYAI_API_KEY env var set
#   - models/en_US-lessac-medium.onnx     (Piper ONNX voice model)
#
# Build:  cargo build --release -p voice-pipes-cli --features stt-assemblyai
# Usage:  voice-pipes --config examples/live/openai.toml live
#         voice-pipes --config examples/live/openai.toml live --silence-ms 800

[pipeline]
name = "live-openai"

[stt]
provider = "assemblyai"
model_name = "u3-rt-pro"
sample_rate = 16000

[turn_detection]
mode = "provider"

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[[text_processor]]
type = "openai-compat"
model = "gpt-4o-mini"
system_prompt = "You are a helpful voice assistant. Be concise."
max_tokens = 256
temperature = 0.7

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

[pipeline.audit]
enabled = true
captures_dir = "captures"

[transport]
enabled = true
bind = "0.0.0.0"
port = 8800
