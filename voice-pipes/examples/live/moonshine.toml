# Live mode: mic → VAD → STT (Moonshine) → LLM → TTS (VibeVoice) → speaker.
#
# Uses local Moonshine Base for STT + local VibeVoice-Realtime for TTS.
# Both run on GPU (CUDA).  No cloud API keys needed for STT/TTS.
#
# Prerequisites:
#   1. Start VibeVoice server:  python scripts/vibevoice/server.py
#   2. Set VP_ORT_EP=cuda for GPU-accelerated STT
#
# Build:  cargo build --release -p voice-pipes-cli --features stt-moonshine-cuda,tts-openai,turn-smart
# Usage:  VP_ORT_EP=cuda voice-pipes --config examples/live/moonshine.toml live

[pipeline]
name = "live-moonshine-stt"

[stt]
provider = "moonshine"
model_dir = "models/moonshine"

[vad]
mode = "silero"
model = "models/silero_vad.onnx"

[turn_detection]
mode = "smart"
smart_model_path = "models/smart-turn-v3.2-cpu.onnx"
smart_threshold = 0.5
smart_window_secs = 8
smart_min_audio_ms = 500
silence_timeout_ms = 600


[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 2000.0

[pipeline.audit]
enabled = true
captures_dir = "captures"

[[text_processor]]
type = "openai-compat"
model = "gpt-4o-mini"
system_prompt = "You are a helpful voice assistant. Be concise."
max_tokens = 256
temperature = 0.7

[tts]
provider = "openai"
endpoint = "http://localhost:8091/v1"
model_name = "VibeVoice-Realtime-0.5B"
voice = "default"
api_key = "local"

[transport]
enabled = true
bind = "0.0.0.0"
port = 8800
