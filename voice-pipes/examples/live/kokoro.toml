# Live mode: mic → VAD → STT → LLM → TTS → speaker (full real-time voice loop).
#
# Same as default.toml but uses Kokoro TTS for higher-quality voice output.
# Speak naturally — the pipeline responds when you pause. Press Ctrl+C to stop.
#
# Prerequisites:
#   - ASSEMBLYAI_API_KEY env var set
#   - llama-server running: llama-server -m models/gemma4-e2b/gemma-4-E2B-it-Q4_K_M.gguf --port 8081 -ngl 99 -c 4096 --jinja
#   - models/kokoro-v1.0.onnx, models/voices-v1.0.bin   (Kokoro TTS models)
#
# Build:  cargo build --release -p voice-pipes-cli --features stt-assemblyai,tts-kokoro
# Usage:  voice-pipes --config examples/live/kokoro.toml live
#         voice-pipes --config examples/live/kokoro.toml live --silence-ms 800

[pipeline]
name = "live-kokoro"

[stt]
provider = "assemblyai"
model_name = "u3-rt-pro"
sample_rate = 16000

[turn_detection]
mode = "provider"

[[text_processor]]
type = "openai-compat"
base_url = "http://localhost:8081/v1"
model = "gemma4-7b-instruct.gguf"
system_prompt = "You are a helpful voice assistant. Be concise."
max_tokens = 256
temperature = 0.7

[tts]
provider = "kokoro"
model = "models/kokoro-v1.0.onnx"
voices = "models/voices-v1.0.bin"
voice = "af_heart"
