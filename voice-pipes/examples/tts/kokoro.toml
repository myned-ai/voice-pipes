# TTS-only config for Kokoro.
#
# Models required:
#   - models/kokoro-v1.0.onnx      (ONNX export from kokoro-onnx, ~310 MB)
#   - models/voices-v1.0.bin       (NPZ voice embeddings, ~27 MB)
#
# Download models (PowerShell):
#   Invoke-WebRequest -Uri "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -OutFile "models/kokoro-v1.0.onnx"
#   Invoke-WebRequest -Uri "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -OutFile "models/voices-v1.0.bin"
#
# Download models (curl):
#   curl -L -o models/kokoro-v1.0.onnx  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
#   curl -L -o models/voices-v1.0.bin   https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
#
# Build:  cargo build --release -p voice-pipes-cli --features tts-kokoro
# Usage:  voice-pipes --config examples/tts/kokoro.toml tts --text "Hello, world!" --output hello.wav

[tts]
provider = "kokoro"
model = "models/kokoro-v1.0.onnx"
voice = "af_heart"
voices = "models/voices-v1.0.bin"
