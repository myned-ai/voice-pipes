# Live pipeline with Parakeet-TDT STT + Silero VAD + OpenAI LLM (gpt-4o-mini) + Piper TTS.
#
# Build:  cargo build --release -p voice-pipes-cli
# Run:    cargo run   --release -p voice-pipes-cli -- \
#                       --config examples/test-live-parakeet.toml live
#
# Requires OPENAI_API_KEY environment variable to be set.
# Requires Parakeet-TDT ONNX weights under `models/parakeet-tdt/`
# (encoder-model.int8.onnx + decoder_joint-model.int8.onnx + nemo128.onnx + vocab.txt).

[pipeline]
name = "live-parakeet"

[pipeline.audit]
enabled = true
captures_dir = "captures"

[transport]
enabled = true
port = 8800

[vad]
mode = "silero"
model = "models/silero_vad.onnx"
speech_prob = 0.5
min_speech_ms = 200
min_silence_ms = 600

[stt]
provider = "parakeet-tdt"
model_dir = "models/parakeet-tdt"

[stt.options]
initial_buffer_ms = 800.0
inference_step_ms = 1000.0

[turn_detection]
mode = "layered"
silence_timeout_ms = 1000

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

[[text_processor]]
type = "openai-compat"
model = "gpt-4o-mini"
system_prompt = "You are a friendly voice assistant named Pipes. Have a natural conversation. Keep responses to one or two short sentences."
max_tokens = 128
temperature = 0.6
