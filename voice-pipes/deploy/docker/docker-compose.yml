services:
  orchestrator:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # The orchestrator builds the live pipeline graph (GET /api/v1/pipeline)
        # and resolves each node's param-schema via its OWN compiled-in provider
        # factories (lookup_{stt,tts,text}_factory). Those are feature-gated, so
        # without them a provider resolves to a bare "Unknown provider -- no schema
        # registered" node — e.g. VibeVoice-as-openai showed only "Provider: openai"
        # with no Model/Voice/Endpoint rows. The orchestrator never runs synthesis,
        # so these are schema-only. The one list every worker builds is defined here.
        - &worker-features FEATURES=realtime,text-grpc,tts-kokoro,tts-pocket,stt-moonshine,tts-openai,tts-elevenlabs,stt-assemblyai,stt-google,tts-gemini,stt-nemotron,stt-nemotron35,turn-smart
    command:
      - orchestrate
      - --orchestrator-config
      - deploy/docker/config/orchestrator.toml
    ports:
      - "9090:9090"
    volumes:
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ../../sessions:/app/sessions
      # Benchmark experiments/suites/results (BenchmarkStore) — persisted on
      # the host so runs survive container rebuilds.
      - ../../benchmarks:/app/benchmarks
      - ./config:/app/deploy/docker/config
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_ADMIN_TOKEN
      - VP_INTERNAL_TOKEN
    # The image's own check probes a worker's port; the orchestrator
    # answers on 9090. Workers wait for this before they start, so their
    # first registration finds it.
    healthcheck:
      test: ["CMD", "voice-pipes", "healthz", "--url", "http://127.0.0.1:9090/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # A/B comparison pair: two workers on one pipeline, for benchmarks that
  # dispatch by tag. Behind a profile so a plain `up` does not start them;
  # their host ports are their own, so they run beside the default workers.
  worker-a:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
    profiles: ["ab"]
    command:
      - --config
      - deploy/docker/config/pipeline-openai-host.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-a.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8801:8800"
      - "127.0.0.1:8096:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - VP_ORT_EP=${VP_ORT_EP:-cpu}
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-b:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
    profiles: ["ab"]
    command:
      - --config
      - deploy/docker/config/pipeline-openai-host.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-b.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8802:8800"
      - "127.0.0.1:8097:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - VP_ORT_EP=${VP_ORT_EP:-cpu}
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-gpu:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile.cuda
    profiles: ["gpu"]
    command:
      - --config
      - deploy/docker/config/pipeline-openai-host.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-gpu.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8809:8800"
      - "127.0.0.1:8087:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - VP_ORT_EP=${VP_ORT_EP:-cpu}
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-custom:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # tts-openai: the wizard's "OpenAI TTS (Cloud)" and VibeVoice (host GPU
        # sidecar, reached via the openai provider) options both need it.
        # stt-assemblyai: the wizard's default STT choice needs it.
        # tts-gemini / stt-nemotron: the wizard's Gemini TTS + Nemotron STT options.
        # stt-nemotron35: the Nemotron 3.5 plugin recogniser (40 locales).
        # text-grpc: the agent-grpc gateway + gRPC agent tool backend, used for
        #   out-of-turn agentic tool calls.
        # turn-smart: the wizard's "Smart" turn-detection option (Pipecat Smart Turn v2).
        - *worker-features
    command:
      - --config
      - deploy/docker/config/pipeline-custom.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-custom.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8800:8800"
      - "127.0.0.1:8085:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - VP_ORT_EP=${VP_ORT_EP:-cpu}
      # Gemini TTS reads GOOGLE_API_KEY (not GEMINI_API_KEY — that's for realtime).
      - GOOGLE_API_KEY
      # Google Cloud STT (stt-google): project for the recognizer path, and an
      # optional service-account key path *inside the container* (mount it —
      # e.g. under models/, which is at /app/models). Unset ⇒ ADC discovery.
      - GOOGLE_CLOUD_PROJECT
      - GOOGLE_APPLICATION_CREDENTIALS
      # Mirror of the llama-server offload setting so the worker can surface the
      # *requested* LLM device in the session diagnostic (unconfirmed; the
      # sidecar's actual offload can't be read over HTTP.
      - LLAMA_GPU_LAYERS
      # Wire-level diagnostics (e.g. RUST_LOG=voice_pipes::realtime=trace logs
      # raw provider frames) — unset ⇒ the image's voice_pipes=info default.
      - RUST_LOG
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # English cascade for collecting turn-detection corpora. Fully local --
  # Parakeet + SmolLM2 + Piper, all on CPU -- so it needs no sidecar and no
  # API key, and starts with the stack. Its reason to exist is
  # `record_session_audio` in pipeline-english-corpus.toml.
  worker-english-corpus:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # Identical to worker-custom's list so both services share one built
        # image layer. This pipeline needs only default features (Parakeet,
        # Piper, Silero, the in-process GGUF); the extras cost nothing here
        # and save a second full compile.
        - *worker-features
    command:
      - --config
      - deploy/docker/config/pipeline-english-corpus.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-english-corpus.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      # 8803: 8800-8802 are taken by the other workers in this file.
      - "8803:8800"
      - "127.0.0.1:8086:8085"
    volumes:
      - ../../models:/app/models
      # The same captures directory as every other worker, deliberately.
      #
      # A separate one keeps a corpus tidy on disk but puts it somewhere the
      # console cannot look: the backend resolves a single `CAPTURES_DIR`, so
      # sessions written anywhere else report "local captures missing" and
      # lose audio playback, the event timeline and per-turn metrics -- for
      # the one pipeline whose whole purpose is recording. Sessions carry
      # their pipeline name, so a corpus stays separable by metadata, which
      # is what the bench tool filters on in any case.
      - ../../captures:/app/captures
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - RUST_LOG
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # Copies of the English cascade that differ from worker-english-corpus in
  # the recogniser alone, so they can be compared from the Playground by
  # picking the pipeline. See config/pipeline-english-{moonshine,nemotron,nemotron35}.toml.
  worker-english-nemotron35:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # The same list as worker-english-corpus, so all of them share one image.
        - *worker-features
    command:
      - --config
      - deploy/docker/config/pipeline-english-nemotron35.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-english-nemotron35.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8810:8800"
      - "127.0.0.1:8095:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - RUST_LOG
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-english-moonshine:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # The same list as worker-english-corpus, so all three share one image.
        - *worker-features
    command:
      - --config
      - deploy/docker/config/pipeline-english-moonshine.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-english-moonshine.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8807:8800"
      - "127.0.0.1:8093:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - RUST_LOG
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # Behind a profile because its model has to be exported by hand first
  # (scripts/README-export-nemotron.md); without it the worker cannot start
  # and `restart: unless-stopped` would loop it.
  worker-english-nemotron:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        # The same list as worker-english-corpus, so all three share one image.
        - *worker-features
    profiles: ["nemotron"]
    command:
      - --config
      - deploy/docker/config/pipeline-english-nemotron.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-english-nemotron.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8808:8800"
      - "127.0.0.1:8094:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - RUST_LOG
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-custom-gpu:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile.cuda
      args:
        # The CPU workers' list: Dockerfile.cuda adds `cuda,ort-cuda`, which
        # switch every linked ONNX provider and the GGUF model onto the GPU.
        - *worker-features
    profiles: ["gpu"]
    # Shares worker-custom.toml, whose advertise_address is "worker-custom:8085"
    # — alias this service to that name so the orchestrator's proxied live
    # edits resolve it when the GPU profile replaces the CPU worker.
    networks:
      default:
        aliases:
          - worker-custom
    command:
      - --config
      - deploy/docker/config/pipeline-custom.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-custom.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8800:8800"
      - "127.0.0.1:8085:8085"
    volumes:
      - ../../models:/app/models
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - VP_ORT_EP=${VP_ORT_EP:-cpu}
      # Gemini TTS reads GOOGLE_API_KEY (not GEMINI_API_KEY — that's for realtime).
      - GOOGLE_API_KEY
      # Google Cloud STT (stt-google): project for the recognizer path, and an
      # optional service-account key path *inside the container* (mount it —
      # e.g. under models/, which is at /app/models). Unset ⇒ ADC discovery.
      - GOOGLE_CLOUD_PROJECT
      - GOOGLE_APPLICATION_CREDENTIALS
      # See worker-custom: surfaces the requested LLM device in the diagnostic.
      - LLAMA_GPU_LAYERS
      - RUST_LOG
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # S2S benchmark workers — one per realtime provider, tagged for benchmark
  # variant dispatch (worker tags "s2s-openai" / "s2s-gemini"). Started only
  # for A/B provider comparisons:
  #   docker compose --profile bench-s2s up -d
  # See scripts/bench-s2s-compare.ps1 for the suite/experiment seeding.
  worker-s2s-openai:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        - FEATURES=realtime
    profiles: ["bench-s2s"]
    command:
      - --config
      - deploy/docker/config/pipeline-s2s-openai.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-s2s-openai.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8804:8800"
      - "127.0.0.1:8088:8085"
    volumes:
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - OPENAI_API_KEY
      # Wire-level diagnostics (e.g. RUST_LOG=voice_pipes=trace logs raw
      # provider frames) — unset ⇒ the binary's voice_pipes=info default.
      - RUST_LOG
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  worker-s2s-gemini:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        - FEATURES=realtime
    profiles: ["bench-s2s"]
    command:
      - --config
      - deploy/docker/config/pipeline-s2s-gemini.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-s2s-gemini.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8805:8800"
      - "127.0.0.1:8089:8085"
    volumes:
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - GEMINI_API_KEY
      # See worker-s2s-openai: wire-level diagnostics passthrough.
      - RUST_LOG
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # Requires ELEVENLABS_AGENT_ID in the environment (or a literal agent_id in
  # pipeline-s2s-elevenlabs.toml) before it can start — start it explicitly
  # once configured; bench-s2s-compare.ps1 treats this variant as optional.
  worker-s2s-elevenlabs:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile
      args:
        - FEATURES=realtime
    profiles: ["bench-s2s"]
    command:
      - --config
      - deploy/docker/config/pipeline-s2s-elevenlabs.toml
      - serve
      - --worker-config
      - deploy/docker/config/worker-s2s-elevenlabs.toml
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "8806:8800"
      - "127.0.0.1:8090:8085"
    volumes:
      - ../../captures:/app/captures
      - ../../audit:/app/audit
      - ./config:/app/deploy/docker/config
    environment:
      # Auth tokens (generated by the launcher into voice-pipes/.env).
      - VP_CLIENT_TOKEN
      - VP_INTERNAL_TOKEN
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      # See worker-s2s-openai: wire-level diagnostics passthrough.
      - RUST_LOG
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    restart: unless-stopped

  # llama-server sidecar — started only when the wizard selects "Gemma 4 via llama-server".
  # The launch script sets LLAMA_MODEL to the GGUF path (relative to models/) and uses --profile llama.
  # GPU: defaults to 99 (offload all layers to GPU) since the sidecar runs the
  # CUDA llama.cpp image and reserves an nvidia device below. Set
  # LLAMA_GPU_LAYERS=0 for CPU-only hosts.
  llama-server:
    # Pinned build (b9994, 2026-07): tool calling needs a build with the PEG
    # tool-call grammar parser (llama.cpp #21326) or Gemma 4 streamed tool
    # calls land in the reasoning field instead of delta.tool_calls.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b9994
    profiles: ["llama"]
    # The server has no authentication: the worker reaches it over the
    # compose network, and the host port is loopback-only so nothing on the
    # LAN gets a free inference endpoint.
    ports:
      - "127.0.0.1:8081:8081"
    # Reads the model and writes nothing, so it runs as the host user's ids
    # like the workers do.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    volumes:
      - ../../models:/models
    environment:
      - LLAMA_MODEL
      - LLAMA_GPU_LAYERS
      - LLAMA_CTX
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command:
      # --jinja enables the GGUF's built-in tool-aware chat template — without
      # it llama-server silently ignores the OpenAI `tools` field and client
      # tool calling never fires. Keep the default --reasoning-format auto:
      # it diverts Gemma 4's thinking channel into reasoning_content, which
      # the openai-compat processor never reads (so it is never spoken).
      - >
        /app/llama-server
        -m /models/$${LLAMA_MODEL:-gemma4-e2b/gemma-4-E2B-it-Q4_K_M.gguf}
        --port 8081
        --host 0.0.0.0
        -ngl $${LLAMA_GPU_LAYERS:-99}
        -c $${LLAMA_CTX:-4096}
        --jinja
    # The upstream image bakes in a healthcheck against port 8080; the command
    # above moves the server to 8081, so without this override the container
    # reports "unhealthy" forever. start_period covers the model load.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # Kyutai Pocket-TTS — CPU TTS sidecar (upstream FastAPI server via uvx).
  # Started only when the wizard selects Pocket-TTS (launcher adds --profile
  # pocket). The worker reaches it at http://pocket-tts:8000 on the shared
  # network. Model weights + the uv/pip cache persist under
  # models/.cache/pocket-tts so the first-run download isn't repeated.
  pocket-tts:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["pocket"]
    # No authentication on the server: loopback-only on the host, like
    # llama-server; the worker reaches it over the compose network.
    ports:
      - "127.0.0.1:8002:8000"
    # Runs as the host user's ids. uv and Hugging Face put their caches
    # under HOME, which is the mounted cache directory, so the image's root
    # home is never written to. Its own directory: the caches earlier
    # root-run sidecars left in models/.cache are root-owned and read-only
    # to this user (the launcher creates this one first).
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    volumes:
      - ../../models/.cache/pocket-tts:/cache
      - ./scripts/pocket-tts-entrypoint.sh:/usr/local/bin/pocket-tts-entrypoint.sh:ro
    environment:
      - HF_TOKEN
      - HOME=/cache
      - UV_CACHE_DIR=/cache/uv
      - HF_HOME=/cache/huggingface
    # Entrypoint launches `pocket-tts serve` and fires one warm-up synthesis
    # so the first real turn doesn't pay the ~1.4s cold first-byte cost.
    entrypoint: ["sh", "/usr/local/bin/pocket-tts-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # VibeVoice-Realtime GPU TTS sidecar — Microsoft VibeVoice-Realtime-0.5B served
  # as an OpenAI-compatible /v1/audio/speech endpoint on :8091. Started only when
  # the wizard selects VibeVoice (launcher adds --profile vibevoice). The worker
  # reaches it at http://vibevoice:8091 on the shared compose network (like
  # pocket-tts), so the pipeline config's TTS endpoint is `http://vibevoice:8091/v1`.
  #
  # Weights (models/vibevoice) and voice .pt prompts (VibeVoice/demo/voices) are
  # volume-mounted from the repo and downloaded on first boot by the entrypoint,
  # so they persist on the host across restarts and the image stays lean. Reserves
  # an nvidia device like llama-server; server.py auto-detects cuda.
  vibevoice:
    build:
      context: ../../..
      dockerfile: voice-pipes/Dockerfile.vibevoice
    profiles: ["vibevoice"]
    ports:
      # Loopback-only on the host, like the other sidecars.
      - "127.0.0.1:8091:8091"
    volumes:
      - ../../models:/app/models
      - ../../VibeVoice/demo/voices:/app/VibeVoice/demo/voices
    environment:
      # Public repos, so no token is strictly required; passed through for parity
      # with the other sidecars and in case of HF rate limits on first download.
      - HF_TOKEN
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Run as the host user's ids on Linux (launcher exports them);
    # falls back to the image's built-in unprivileged uid.
    user: "${VP_UID:-10001}:${VP_GID:-10001}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
