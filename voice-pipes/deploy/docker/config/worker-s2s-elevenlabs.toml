# S2S benchmark worker (ElevenLabs Agents variant). The "s2s-elevenlabs"
# tag is what benchmark variants use for dispatch routing — see
# scripts/bench-s2s-compare.ps1.

id = "worker-s2s-elevenlabs"
max_concurrent = 4
debug_port = 8085
# Must stay 0.0.0.0 inside the container: the orchestrator reaches this API
# over the compose network via advertise_address. The host publication in
# docker-compose.yml is bound to 127.0.0.1 and the API needs VP_INTERNAL_TOKEN.
debug_bind = "0.0.0.0"
advertise_address = "worker-s2s-elevenlabs:8085"
tags = ["s2s-elevenlabs"]

[orchestrator]
endpoint = "http://orchestrator:9090"
heartbeat_interval_s = 5
register_timeout_s = 10
