# Worker for the Croatian cascade on the Nemotron 3.5 plugin recogniser
# (pipeline-croatian-nemotron35.toml), run next to the default worker by
# docker-compose.croatian.yml.

id = "worker-croatian-nemotron35"
# One session at a time: the pipeline loads one session set (1.3 GB each),
# and the worker warns at start when it admits more sessions than that.
max_concurrent = 1
debug_port = 8085
# 0.0.0.0 inside the container: the orchestrator reaches the debug API over
# the compose network via advertise_address.
debug_bind = "0.0.0.0"
advertise_address = "worker-croatian-nemotron35:8085"
# Published on host port 8809; the Playground dispatch must hand browsers
# this address, not the container's 8800.
transport_advertise_address = "localhost:8809"
tags = ["lang:hr", "stt:local", "stt:plugin"]

[orchestrator]
endpoint = "http://orchestrator:9090"
heartbeat_interval_s = 5
register_timeout_s = 10
