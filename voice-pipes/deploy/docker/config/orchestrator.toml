bind = "0.0.0.0"
port = 9090
cors_origins = ["http://localhost:3000"]
captures_dir = "captures"

[workers]
heartbeat_timeout_s = 30
reap_interval_s = 10

[sessions]
max_entries = 50000

# Persist the session/turn index so history survives orchestrator restarts and
# supports fast filtered queries. Path is relative to the container workdir
# (/app) and is backed by the ../../sessions host bind-mount in
# docker-compose.yml. Alternatives: "fs" (one JSON file per record) or
# "memory" (ephemeral in-RAM ring buffer, lost on restart).
[sessions.store]
provider = "sqlite"
path = "sessions/sessions.db"

[dispatch]
policy = "least-connections"

[audit]
shared_dir = "audit"

# Refuse to start unless VP_ADMIN_TOKEN and VP_INTERNAL_TOKEN are set
# (generated by the launcher into voice-pipes/.env). Set `required = false`
# only for a loopback-only dev box.
[auth]
required = true
