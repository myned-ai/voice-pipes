# Worker for the Croatian cascade (pipeline-croatian.toml), run next to the
# default worker by docker-compose.croatian.yml.

id = "worker-croatian"
max_concurrent = 4
debug_port = 8085
# 0.0.0.0 inside the container: the orchestrator reaches the debug API over
# the compose network via advertise_address.
debug_bind = "0.0.0.0"
advertise_address = "worker-croatian:8085"
# Published on host port 8801; the Playground dispatch must hand browsers
# this address, not the container's 8800.
transport_advertise_address = "localhost:8801"
tags = ["lang:hr"]

[orchestrator]
endpoint = "http://orchestrator:9090"
heartbeat_interval_s = 5
register_timeout_s = 10
