# Automatically generated by voice-pipes config-wizard

[pipeline]
name = "custom-classic"

[pipeline.audit]
enabled = true

[stt]
provider = "parakeet-tdt"
model_dir = "models/parakeet-tdt"

[[text_processor]]
type = "openai-compat"
base_url = "http://llama-server:8081/v1"
model = "gemma-4-E2B-it"
api_key = ""
system_prompt = "You are a friendly voice assistant. Keep responses to one or two short sentences."
max_tokens = 1024
temperature = 1.0
top_p = 0.95
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[tts]
provider = "piper"
model = "models/en_US-lessac-medium.onnx"

[vad]
mode = "auto"
model = "models/silero_vad.onnx"

[turn_detection]
mode = "smart"
silence_timeout_ms = 500
smart_model_path = "models/smart-turn-v3.2-cpu.onnx"
smart_threshold = 0.5
smart_window_secs = 8
smart_min_audio_ms = 500

[barge_in]
enabled = true
min_chunks = 3
speech_threshold = 200.0

[output]
sample_rate = 16000

[output.chunking]
enabled = true
frame_ms = 50

[transport]
enabled = true
bind = "0.0.0.0"
port = 8800

# Refuse to start unless VP_CLIENT_TOKEN and VP_INTERNAL_TOKEN are set
# (the launcher generates them into voice-pipes/.env). Set `required = false`
# only for a loopback-only dev box.
[auth]
required = true

# Client-side tools: executed by the connected client (Playground / SDK),
# which reports back via `client_tool_result`.
[[client_tool]]
name = "navigate"
description = "Navigate the client UI to a named screen."
speak_on_result = false
[client_tool.parameters]
type = "object"
properties = { screen = { type = "string", description = "Target screen name." } }
required = ["screen"]

[[client_tool]]
name = "play_media"
description = "Start playback of a named media item on the client device."
speak_on_result = true
[client_tool.parameters]
type = "object"
properties = { title = { type = "string", description = "Media item title or id." } }
required = ["title"]
